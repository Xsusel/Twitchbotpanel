<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logowanie - XSUS Sentinel</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1a1a1a; }
        .login-box { background-color: #2d2d2d; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center; }
        input[type="password"] { padding: 10px; margin: 10px 0; width: 100%; border-radius: 4px; border: 1px solid #444; background: #333; color: white; }
        button { padding: 10px 20px; background-color: #0053f1; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #003db3; }
        h2 { color: #0053f1; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Logowanie XSUS Sentinel</h2>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p style="color: red;">{{ message }}</p>
            {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="password" name="password" placeholder="Wprowadź hasło" required>
            <button type="submit">Zaloguj się</button>
        </form>
    </div>
</body>
</html>
