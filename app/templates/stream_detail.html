{% extends "base.html" %}

{% block content %}
<div class="row mb-3">
    <div class="col-12">
        <a href="{{ url_for('main.channel_detail', channel_id=stream.channel_id) }}" class="btn btn-secondary mb-3"><i class="fas fa-arrow-left"></i> Powrót do Kanału</a>
        <h2 class="text-primary">Archiwum Transmisji: {{ stream.started_at.strftime('%Y-%m-%d %H:%M') }}</h2>
        <p class="lead">{{ stream.title }} ({{ stream.game_name }})</p>
    </div>
</div>

<div class="row">
    <div class="col-md-12 mb-4">
        <div class="card">
            <div class="card-header">Historia Widzów</div>
            <div class="card-body">
                <div style="height: 300px;">
                    <canvas id="streamChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">Odtwarzacz Logów Czatu</div>
            <div class="card-body bg-black p-0">
                <div id="streamLogs" style="height: 500px; overflow-y: auto; padding: 10px; font-family: monospace;">
                    <!-- Logs -->
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    const streamId = {{ stream.id }};
    const ctx = document.getElementById('streamChart').getContext('2d');

    async function loadData() {
        // Stats
        const statsRes = await fetch(`/api/stream/${streamId}/stats`);
        const statsData = await statsRes.json();

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: statsData.labels,
                datasets: [{
                    label: 'Widzowie',
                    data: statsData.viewers,
                    borderColor: '#0053f1',
                    fill: true,
                    backgroundColor: 'rgba(0, 83, 241, 0.1)'
                }, {
                    label: 'Czatujący',
                    data: statsData.chatters,
                    borderColor: '#ff6384'
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // Logs
        const logsRes = await fetch(`/api/stream/${streamId}/logs?limit=5000`);
        const logs = await logsRes.json();
        const container = document.getElementById('streamLogs');

        logs.forEach(log => {
             const div = document.createElement('div');
             div.style.borderBottom = '1px solid #333';
             div.innerHTML = `<span style="color:#888">[${log.timestamp}]</span> <strong style="color:#0053f1">${log.username}</strong>: <span class="text-white">${log.message}</span>`;
             container.appendChild(div);
        });
    }

    loadData();
</script>
{% endblock %}
